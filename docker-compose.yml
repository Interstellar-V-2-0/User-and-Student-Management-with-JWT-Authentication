services:
  db:
    image: mysql:8.0
    container_name: user_student_mgmt_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Qwe.123*
      MYSQL_DATABASE: user_student_mgmt_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: UserStudentMgmt.Api/Dockerfile
    container_name: user_student_mgmt_api
    restart: always
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "server=db;port=3306;database=user_student_mgmt_db;user=root;password=Qwe.123*"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./UserStudentMgmt.Api:/app

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_user_student_mgmt
    restart: always
    depends_on:
      - db
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: Qwe.123*

volumes:
  mysql_data:
